[project]
name = "llm-compression-demo"
version = "0.1.0"
description = "A demo project to reproduce some of the LLM compression results from the CompactifAI paper: https://arxiv.org/pdf/2401.14109"
readme = "README.md"
authors = [
    { name = "Lukas Bannenberg", email = "lukasbannenberg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "datasets>=5.0.1",
    "numpy>=2.0,<2.5",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
